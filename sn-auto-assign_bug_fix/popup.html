<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #14141c;
    --panel: #1c1c28;
    --panel-2: #23232f;
    --border: #33333f;
    --text: #e9e9f0;
    --text-dim: #9494a3;
    --accent: #7c6cf0;
    --accent-hover: #8f80ff;
    --green: #3ecf8e;
    --red: #ff6b6b;
    --amber: #f0b93c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 360px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, Arial, sans-serif;
    font-size: 13px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: white;
    flex-shrink: 0;
  }

  .title {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.2;
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-dim);
  }

  .body { padding: 14px 16px 16px; }

  .field { margin-bottom: 12px; }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 5px;
  }

  input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 9px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: var(--accent); }

  .hint {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.3;
  }

  .row-split {
    display: flex;
    gap: 10px;
  }
  .row-split .field { flex: 1; }

  .hidden { display: none !important; }

  button#stopAlert {
    width: 100%;
    padding: 10px;
    border-radius: 7px;
    border: none;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    background: var(--red);
    color: white;
    margin-bottom: 8px;
  }

  button#toggle {
    width: 100%;
    padding: 10px;
    border-radius: 7px;
    border: none;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    background: var(--accent);
    color: white;
    transition: background 0.15s;
    margin-top: 4px;
  }
  button#toggle:hover { background: var(--accent-hover); }
  button#toggle.stop { background: var(--panel-2); border: 1px solid var(--red); color: var(--red); }
  button#toggle.stop:hover { background: #2a1c1c; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11.5px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .dot.running { background: var(--green); }

  .log-section { margin-top: 14px; }

  .log-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .log-title { margin-bottom: 0; }

  #clearLog {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 10.5px;
    cursor: pointer;
    padding: 2px 4px;
    text-decoration: underline;
  }
  #clearLog:hover { color: var(--text); }

  .log-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }

  #log {
    max-height: 190px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 4px 0;
  }

  .entry {
    display: flex;
    gap: 7px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    line-height: 1.3;
  }
  .entry:last-child { border-bottom: none; }

  .entry .icon { flex-shrink: 0; }
  .entry .time { color: var(--text-dim); flex-shrink: 0; font-family: "SF Mono", Consolas, monospace; font-size: 10.5px; padding-top: 1px; }
  .entry .msg { flex: 1; }

  .entry.assigned .msg { color: var(--green); }
  .entry.error .msg { color: var(--red); }
  .entry.skip .msg, .entry.info .msg { color: var(--text-dim); }

  .empty-log {
    padding: 16px 10px;
    text-align: center;
    color: var(--text-dim);
    font-size: 11.5px;
  }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">SN</div>
    <div>
      <div class="title">ServiceNow Auto-Assign</div>
      <div class="subtitle">GiGi queue watcher</div>
    </div>
  </div>

  <div class="body">
    <div class="field">
      <label>Backend Notify URL (optional)</label>
      <input id="backendUrl" placeholder="http://localhost:5000/extension/ticket-assigned" />
      <div class="hint">Your local Flask agent endpoint (stable now that it runs on this machine).</div>
    </div>

    <div class="row-split">
      <div class="field">
        <label>Your Name</label>
        <input id="assigneeName" placeholder="Akshat Bhardwaj" />
      </div>
      <div class="field" style="max-width: 90px;">
        <label>Scan (min)</label>
        <input id="pollMinutes" type="number" min="1" value="1" />
      </div>
    </div>

    <button id="stopAlert" class="hidden">🔔 Ticket grabbed — Stop Alert</button>

    <button id="toggle">Start Monitoring</button>

    <div class="status-row">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Stopped</span>
    </div>

    <div class="log-section">
      <div class="log-title-row">
        <div class="log-title">Activity</div>
        <button id="clearLog">Clear</button>
      </div>
      <div id="log"><div class="empty-log">No activity yet.</div></div>
    </div>
  </div>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
